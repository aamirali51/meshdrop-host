name: Publish Docker image

# Builds a multi-arch (amd64 + arm64) image for NAS/servers and pushes it to
# GHCR. Runs on cli-v* tags, alongside the npm release.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout host
        uses: actions/checkout@v4

      - name: Checkout engine (@meshdrop-go/core)
        run: git clone --depth 1 https://github.com/aamirali51/meshdrop-core.git ../meshdrop-core

      - name: Checkout app (shared files for vendoring)
        run: git clone --depth 1 https://github.com/aamirali51/meshdrop-app.git ../meshdrop-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare package (vendor + published engine dep)
        run: node scripts/prepare-publish.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aamirali51/meshdrop-host
          tags: |
            type=raw,value=latest
            type=match,pattern=cli-v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
